<!DOCTYPE html>
<html>
<head>
<title>iPhone Planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family: Arial;
margin:0;
background:#000;
color:white;
text-align:center;
}

header{
background:#111;
padding:20px;
font-size:30px;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.product{
background:#1c1c1c;
margin:15px;
padding:20px;
border-radius:10px;
width:200px;
}

button{
background:#25D366;
border:none;
padding:10px;
color:white;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
iPhone Planet
</header>

<h2>Modelos disponibles</h2>

<div class="products">

<div class="product">
<h3>iPhone 15</h3>
<p>128GB / 256GB</p>
<button>Comprar por WhatsApp</button>
</div>

<div class="product">
<h3>iPhone 14 Pro</h3>
<p>128GB / 256GB</p>
<button>Comprar por WhatsApp</button>
</div>

<div class="product">
<h3>iPhone 13</h3>
<p>128GB</p>
<button>Comprar por WhatsApp</button>
</div>

</div>

</body>
</html>
